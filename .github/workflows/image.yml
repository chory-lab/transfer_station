name: image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax
        run: |
          find provisioning -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          # SC1090: these scripts deliberately source config files whose path is
          # only known at runtime.
          shellcheck -S warning -x -e SC1090 $(find provisioning -name '*.sh')

      - name: systemd unit parses
        run: |
          sed -e 's|__PI_USER__|chorylab|g' \
              -e 's|__REPO_DEST__|/home/chorylab/transfer_station|g' \
              -e 's|__SERVER_PORT__|5000|g' \
              provisioning/payload/transfer-station.service > /tmp/transfer-station.service
          systemd-analyze verify /tmp/transfer-station.service 2>&1 | tee /tmp/verify.log
          # Only fail on genuine syntax problems; the runner legitimately
          # complains that User=chorylab and the ExecStart path do not exist.
          ! grep -qiE 'invalid|failed to parse|unknown lvalue' /tmp/verify.log

      - name: bootstrap + README URL consistency
        run: bash provisioning/tests/test_bootstrap.sh

      - name: no stray control characters in tracked files
        run: bash provisioning/tests/test_no_control_chars.sh

      # Fused command lines are valid bash and pass shellcheck. One of them
      # killed stage B on hardware while CI stayed green.
      - name: systemctl calls name units we actually ship
        run: bash provisioning/tests/test_systemctl_calls.sh

      - name: config.env is parseable by both shells
        run: |
          bash -c '. provisioning/config.env; echo "$ETH_ADDRESS:$SERVER_PORT"'

  flash-linux:
    name: flash pipeline (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: injection tests
        run: bash provisioning/tests/test_flash_inject.sh

      - name: full image write via loopback SD card
        run: |
          sudo apt-get update
          sudo apt-get install -y dosfstools parted
          sudo bash provisioning/tests/test_flash_image.sh

  motor-server:
    name: motor server command path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install pinned uv and Redis
        run: |
          curl -LsSf https://astral.sh/uv/0.12.5/install.sh \
            | env UV_INSTALL_DIR="$RUNNER_TEMP/uv-bin" INSTALLER_NO_MODIFY_PATH=1 sh
          echo "$RUNNER_TEMP/uv-bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y redis-server

      - name: install the frozen application environment
        run: uv sync --frozen --no-dev

      - name: real Flask + Redis + A4988 command smoke test
        run: bash provisioning/tests/test_motor_server.sh

  flash-windows:
    name: flash pipeline (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: flash.ps1 parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./provisioning/flash.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./provisioning/bootstrap.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { $_.ToString() }; exit 1 }

      - name: flash.ps1 behaviour + parity with flash.sh
        shell: pwsh
        run: ./provisioning/tests/test_flash_ps1.ps1

  pipeline-rpios:
    name: provisioning on real Raspberry Pi OS (chroot)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: free up disk (the image needs ~7G)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: cache the Raspberry Pi OS download
        uses: actions/cache@v4
        with:
          path: /tmp/rpios-cache/raspios.img.xz
          key: rpios-lite-arm64-${{ github.run_id }}
          restore-keys: rpios-lite-arm64-

      - name: register aarch64 binfmt emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: install host tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static xz-utils fdisk e2fsprogs

      # Runs stage A, stage B and the deployment checks inside the official
      # Raspberry Pi OS Lite arm64 rootfs, against archive.raspberrypi.com.
      # Nothing boots here -- see provisioning/README.md for the gaps.
      - name: stage A -> stage B -> deployment, on genuine Raspberry Pi OS
        run: sudo TS_INPLACE=1 bash provisioning/tests/test_rpios_chroot.sh

  bundle:
    name: build the offline dependency bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: free up disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: cache the Raspberry Pi OS download
        uses: actions/cache@v4
        with:
          path: /tmp/rpios-cache/raspios.img.xz
          key: rpios-lite-arm64-${{ github.run_id }}
          restore-keys: rpios-lite-arm64-

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: install host tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static xz-utils fdisk e2fsprogs

      # Built inside the real Raspberry Pi OS rootfs so apt's own solver
      # resolves the arm64 dependency graph against the real archive.
      - name: build bundle in the Raspberry Pi OS chroot
        run: sudo TS_INPLACE=1 TS_BUILD_BUNDLE=1 bash provisioning/tests/test_rpios_chroot.sh

      - name: bundle contents
        run: |
          ls -R /tmp/ts-bundle | head -40
          du -sh /tmp/ts-bundle
          cat /tmp/ts-bundle/manifest.env

      - name: package
        run: |
          sudo chown -R "$USER" /tmp/ts-bundle
          tar -czf /tmp/offline-bundle.tar.gz -C /tmp/ts-bundle .
          cp /tmp/ts-bundle/manifest.env /tmp/manifest.env
          ls -l /tmp/offline-bundle.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: offline-bundle
          path: /tmp/offline-bundle.tar.gz
          retention-days: 30

      # Published so the bootstraps can fetch it with a plain download, no
      # auth. The tag is rolling: the newest bundle is always at
      # releases/latest/download/offline-bundle.tar.gz
      - name: publish as a release asset
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="offline-bundle"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG"               /tmp/offline-bundle.tar.gz /tmp/manifest.env               --title "Offline dependency bundle"               --notes "$(cat /tmp/manifest.env)"
